name: Alerta de Vencimentos Diário

on:
  schedule:
    # Todos os dias às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Só simular (mostra os e-mails no log, sem enviar)'
        type: boolean
        default: false

jobs:
  verificar-vencimentos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Executar robô de verificação
        run: node scripts/check-vencimentos.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}